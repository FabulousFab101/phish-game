<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
  </head>
  <body style="background-color: teal;">
    <div class="window" style="display:none; position: fixed;top: 50%; left: 50%;transform: translate(-50%, -50%);width: 800px; height: 600px;display: flex; flex-direction: column;">
      <div class="title-bar">
        <div class="title-bar-text">
          <img src="assets/envelope_closed-1.png" alt="Mail" style="margin-top: -4px; margin-bottom: -4px; image-rendering: pixelated;"> Macrohard Mail: Unread Mail
        </div>
        <div class="title-bar-controls">
          <button aria-label="Help"></button>
        </div>
      </div>
      <div class="window-body" style="margin-top: 2px; margin-bottom: 2px; margin-left: 1px; margin-right: 1px; gap: 1px; flex-grow: 1; display: flex; flex-direction: column;">
        <div style="display: flex; gap: 1px; flex-grow: 1;">
          <div class="sunken-panel" style="width: 30%;">
            <table class="interactive" style="width: 100%;">
              <thead>
                <tr>
                  <th>From</th>
                  <th>Subject</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Grandma</td>
                  <td>Hi John, it's Grandma!</td>
                </tr>
                <tr>
                  <td>Global Secure</td>
                  <td>URGENT: RECOVER YOUR FUNDS</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div style="display: flex; width: 70%; flex-direction: column;">
            <div class="status-field-border" style="padding: 8px; margin: 8px;">
              <div style="display: flex; gap: 8px;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <p style="margin: 0%; font-weight: bold;">From:</p>
                  <p style="margin: 0%; font-weight: bold;">Subject:</p>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <p class="from" style="margin: 0%;">  </p>
                  <p class="subject-line" style="margin: 0%;"> </p>
                </div>
              </div>
            </div>
            <div class="field-border body" style="padding: 8px; flex-grow: 1; overflow: auto; height: 0;">
            </div>
          </div>
        </div>
      </div>
      <div style="margin: 4px; gap: 8px; display: flex;">
        <div style="flex-grow: 1;"></div>
        <button disabled class="spam">Mark as Spam</button>
        <button disabled class="read">Mark as Read</button>
      </div>
      <div class="status-bar">
        <p class="status-bar-field"></p>
        <p class="status-bar-field" style="flex-grow: unset; padding-left: 12px; padding-right: 12px;">4:20 PM</p>
      </div>
    </div>
    <div id="overlay" class="off-screen" 
     style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: black; opacity: 1; transition: opacity 2s ease;">
  <button id="start-button" class="start-button" 
          style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);">
    Start Game
  </button>
</div>

<audio id="startup-sound" src="startup.mp3"></audio>
  </body>
  <script src="script1.js"></script>
  <script>
    // ---------------- START BUTTON & OVERLAY ----------------
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-button');
    const startupAudio = document.getElementById('startup-sound');
    const popup = document.getElementById('tutorial-popup');
    const notifyAudio = document.getElementById('notify-sound');

    startBtn.onclick = () => {
      // play startup sound
      startupAudio.play().catch(() => console.log("Startup audio blocked"));

      // fade overlay
      overlay.style.transition = "opacity 7s";
      overlay.style.opacity = 0;

      // hide button immediately
      startBtn.style.display = "none";

      // after fade ends, hide overlay and show popup
      setTimeout(() => {
        overlay.style.display = "none";
        popup.style.display = "block";
        notifyAudio.play().catch(() => console.log("Notify audio blocked"));
      }, 7000);
    }

    // ---------------- UNIVERSAL POPUP ----------------
    function showPopupById(id) {
      const popup = document.getElementById(id);
      if (!popup) return;
      popup.style.display = "block";
      document.getElementById("click-blocker").style.display = "block";
      notifyAudio.play().catch(() => {});
    }

    function closePopupById(id) {
      const popup = document.getElementById(id);
      if (!popup) return;
      popup.style.display = "none";

      // hide blocker only if no popups remain open
      const stillOpen = document.querySelectorAll(".popup-open:not([style*='display: none'])");
      if (stillOpen.length === 0) {
        document.getElementById("click-blocker").style.display = "none";
      }
    }
  </script>
</html>
