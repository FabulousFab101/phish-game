<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inbox</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    body {
      background: teal;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .window {
      width: 900px;
      height: 675px; /* 4:3 ratio */
    }

    /* Outer gray "screen" box */
    .screen-box {
      border: inset 3px;
      background: #c0c0c0;
      padding: 6px;
      height: calc(100% - 50px);
      display: flex;
      flex-direction: column;
    }

    /* Blue header bar inside the screen */
    .inner-header {
      background: navy;
      color: white;
      padding: 4px 6px;
      font-weight: bold;
      margin-bottom: 6px;
      height: 22px;
      display: flex;
      align-items: center;
      border: inset 2px;
      font-size: 14px; /* match title-bar-text */
      width: calc(100%); /* account for screen-box padding */
      box-sizing: border-box;
    }

    /* The two side-by-side white boxes */
    .two-pane {
      flex: 1;
      display: flex;
      border: inset 2px;
      min-height: 0; /* ensures child flex items can shrink properly */
    }

    #subject-list {
      width: 35%;
      background: white;
      border-right: inset 2px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    #content-view {
      flex: 1;
      background: white;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .subject {
      padding: 6px;
      border-bottom: inset 1px;
      cursor: pointer;
    }

    .subject:hover {
      background: #d3d3ff;
    }

    /* Envelope placeholder in title bar */
    .title-bar-text img {
      width: 16px;
      height: 16px;
      margin-right: 6px;
    }

    /* Title bar text font */
    .title-bar-text {
      font-size: 14px; /* same as inner-header */
    }
  </style>
</head>

<div id="overlay" style="
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:sans-serif;
    font-size:20px;
">
  <button id="start-button">Click to Start</button>
</div>

<audio id="startup-sound" src="assets/startup.mp3"></audio>

<script>
const overlay = document.getElementById('overlay');
const audio = document.getElementById('startup-sound');
const startBtn = document.getElementById('start-button');

startBtn.onclick = function() {
    audio.play();
    overlay.style.transition = "opacity 7s";
    overlay.style.opacity = 0;
};
</script>

<!-- Pop-up window -->
<div id="tutorial-popup" class="window" style="
    display:none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    z-index: 10000;
    font-size: 14px;
    height: auto; /* important: prevents huge gray box */
">
  <div class="title-bar">
    <div class="title-bar-text">Yikes</div>
    <div class="title-bar-controls">
      <button aria-label="Close" onclick="closePopup()"></button>
    </div>
  </div>

  <div class="window-body" style="
      padding: 10px 12px;
      text-align: left;       /* force text left */
      display: block;         /* overrides 98.css centering behavior */
  ">
    <p style="margin:0; margin-bottom: 12px;">
      This inbox is a mess. Let’s clean it up.
    </p>

    <div style="text-align:center; width:100%;">
      <button onclick="closePopup()">OK</button>
    </div>
  </div>
</div>

<audio id="notify-sound" src="assets/notify.mp3"></audio>

<script>
// Show popup after fade-in (replace overlay fade timeout)
function showPopup() {
    const popup = document.getElementById('tutorial-popup');
    const notify = document.getElementById('notify-sound');

    popup.style.display = 'block';
    notify.play().catch(() => console.log("Audio blocked, user interaction required."));
}

function closePopup() {
    document.getElementById('tutorial-popup').style.display = 'none';
}

// Example: show popup after startup fade (7s)
setTimeout(showPopup, 7000);
</script>

<body>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">
        <!-- Placeholder envelope PNG; add actual file in assets/ -->
        <img src="assets/mail-envelope.png" alt="Mail"> Email
      </div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>

    <div class="window-body">

      <div class="screen-box">

        <div class="inner-header">Inbox</div>

        <div class="two-pane">
          <div id="subject-list"></div>
          <div id="content-view"></div>
        </div>

      </div>

    </div>

    <!-- Removed score status bar -->

  </div>

  <script src="script.js"></script>
</body>
</html>
